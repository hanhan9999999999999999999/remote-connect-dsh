name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 校验市场索引（index.json）
        run: node tools/validate-index.mjs

      - name: 插件测试（客户端冒烟 / 清单 / 依赖 / 路由 / 端到端）
        working-directory: plugins/dsh-remote-connect
        run: node test/run-all.mjs
